name: Finalize archival release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Publish v1.0.0 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          First formal public archival version of the MATLAB implementation associated with:

          **Iqbal, H., Zheng, J., Chai, R., & Chandrasekaran, S. (2023). “K-Nearest Neighbours and Ensemble Based Real-Time Hand Gesture Recognition for Powered Wheelchair.” 2023 International Conference on Advanced Mechatronic Systems (ICAMechS), 115–120. DOI: 10.1109/ICAMechS59878.2023.10272954.**

          ### Repository preparation

          - Added a publication-focused README with research context, gesture/control mapping, algorithm summary, requirements, safety scope, reproducibility limitations, and citation guidance.
          - Added `CITATION.cff` with DOI-backed preferred citation metadata.
          - Added `REPRODUCIBILITY.md` documenting archived artifacts and paper/archive configuration differences.
          - Added contribution guidance and MATLAB-specific ignore rules.
          - Added explicit repository version metadata and changelog.
          - Removed two MATLAB `.asv` autosave files as non-authoritative editor artifacts.

          ### Research code

          - No MATLAB `.m` research implementation was modified as part of the public-archive preparation.
          - Existing KNN/ensemble models, confusion matrices, training vectors/labels, and image artifacts were retained unchanged for provenance.
          - Participant-level raw sEMG recordings are not distributed in the repository.

          ### Reproducibility

          - The paper reports KNN accuracy of 99.74% and ensemble accuracy of 97.68%.
          - Paper/archive configuration differences are documented in `REPRODUCIBILITY.md` rather than retroactively rewriting historical source.

          ### Scope

          Version 1.0.0 denotes the archived public research-code state. It does not imply clinical, regulatory, medical-device, or production readiness.
          EOF

          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "Release v1.0.0 already exists."
          else
            gh release create v1.0.0 \
              --target main \
              --title "v1.0.0 — Archival Research Release" \
              --notes-file release-notes.md \
              --latest
          fi

      - name: Attempt About metadata and topics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set +e
          curl -sS -o /tmp/repo-response.txt -w "Repository metadata HTTP %{http_code}\n" \
            -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }} \
            -d '{"description":"MATLAB research code for real-time sEMG hand-gesture recognition and powered-wheelchair control using KNN and ensemble learning.","homepage":"https://doi.org/10.1109/ICAMechS59878.2023.10272954"}'
          cat /tmp/repo-response.txt

          curl -sS -o /tmp/topics-response.txt -w "Topics HTTP %{http_code}\n" \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/topics \
            -d '{"names":["semg","hand-gesture-recognition","knn","ensemble-learning","powered-wheelchair","assistive-technology","human-machine-interface","matlab"]}'
          cat /tmp/topics-response.txt
          exit 0
